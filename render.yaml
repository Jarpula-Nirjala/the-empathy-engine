# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect repo → apply this file
#
# IMPORTANT: This app loads DistilRoBERTa + PyTorch (~1–2 GB RAM).
# Use at least the Standard plan (2 GB RAM). Free/Starter (512 MB) will OOM.

services:
  - type: web
    name: the-empathy-engine
    runtime: docker
    region: oregon
    plan: standard
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: HF_HOME
        value: /app/.cache/huggingface
      - key: TRANSFORMERS_CACHE
        value: /app/.cache/huggingface
      - key: NLTK_DATA
        value: /app/.cache/nltk
      - key: LOG_LEVEL
        value: INFO
