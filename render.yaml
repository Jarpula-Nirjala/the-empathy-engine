# Render Blueprint — Free tier (512 MB) — professional UI + VADER backend
# For full DistilRoBERTa AI: change dockerfilePath to Dockerfile and plan to standard

services:
  - type: web
    name: the-empathy-engine
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: Dockerfile.free
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: USE_VADER_ONLY
        value: "true"
      - key: NLTK_DATA
        value: /app/.cache/nltk
      - key: LOG_LEVEL
        value: INFO
