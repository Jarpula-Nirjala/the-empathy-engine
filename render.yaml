# Render — default uses Dockerfile (Free tier safe, VADER backend)

services:
  - type: web
    name: the-empathy-engine
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: USE_VADER_ONLY
        value: "true"
      - key: NLTK_DATA
        value: /app/.cache/nltk
