# Render Blueprint — https://render.com/docs/blueprint-spec
# Requires Standard plan (2 GB RAM) — Free/Starter will OOM at runtime.

services:
  - type: web
    name: the-empathy-engine
    runtime: docker
    region: oregon
    plan: standard
    branch: main
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: HF_HOME
        value: /app/.cache/huggingface
      - key: TRANSFORMERS_CACHE
        value: /app/.cache/huggingface
      - key: NLTK_DATA
        value: /app/.cache/nltk
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: LOG_LEVEL
        value: INFO
